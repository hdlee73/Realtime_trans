name: Android Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: 1.0.1) - 태그 vX.Y.Z 와 릴리스를 자동 생성'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # 정식 서명키: 레포의 keystore/keystore.properties 가 있으면 그것을, 없으면 Secrets 를 사용
      - name: Prepare release keystore from Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f keystore/keystore.properties ] && [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "RELEASE_STORE_FILE=keystore/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease -PappVersionName=${{ steps.ver.outputs.name }} --no-daemon --stacktrace

      - name: Collect signed release APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "::error::릴리스 APK가 정식 키로 서명되지 않았습니다. keystore 설정을 확인하세요."
            exit 1
          fi
          cp "$APK" "dist/RealtimeTrans-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/RealtimeTrans-v${{ steps.ver.outputs.name }}-debug.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-translator-apks
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
